# docker compose up --build
# Before the first run: python scripts/prepare_medquad.py   (creates dataset/medquad.json)
# Ollama runs on the host (ollama serve; ollama pull llama3.1:8b), not in a container.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-false}
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; built in on Mac/Windows
    volumes:
      - ./dataset:/app/dataset:ro
      - ./vector_db:/app/vector_db
      - api_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
